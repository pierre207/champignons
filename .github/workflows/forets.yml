name: Carte des forêts

# Génère les départements manquants, région par région (les plus forestières d'abord).
# Une exécution par mois complète ce qui manque.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 1 * *"  # le 1er de chaque mois
  push:
    branches: [main]
    paths: ["scripts/forets.py", "scripts/regions.py", ".github/workflows/forets.yml"]

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  forets:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q p7zip-full
          pip install -q geopandas pyogrio rasterio pillow numpy
      - name: Générer les régions manquantes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for r in $(python scripts/regions.py --ordre); do
            deps=$(python scripts/regions.py --manquants "$r")
            [ -z "$deps" ] && continue
            echo "::group::$r : $deps"
            python scripts/forets.py --deps $deps || { echo "Échec $r"; echo "::endgroup::"; continue; }
            region=$(python -c "import sys; sys.path.insert(0,'scripts'); from regions import METEO; print(METEO['${deps%% *}'])")
            python scripts/meteo.py --regions "$region" || echo "Météo $region en échec"
            git add public/data
            git commit -q -m "Données forêts : $r"
            git pull --rebase -q && git push -q
            echo "::endgroup::"
          done
