name: Météo

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4,15 * * *"  # vers 5 h et 16 h (heure de Paris en hiver)
  push:
    branches: [main]
    paths: ["scripts/meteo.py", ".github/workflows/meteo.yml"]

permissions:
  contents: write

concurrency:
  group: meteo
  cancel-in-progress: false

jobs:
  meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer la météo
        run: python scripts/meteo.py --zone alsace
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Météo $(date -u +%F\ %H:%M)"
          git pull --rebase -q && git push
