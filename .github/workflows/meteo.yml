name: Météo

on:
  workflow_dispatch:
  schedule:
    - cron: "7 5 * * *"  # 6 h (hiver) ou 7 h (été) heure de Paris ; environ 2 h de récupération (limite horaire)
  push:
    branches: [main]
    paths: ["scripts/meteo.py", ".github/workflows/meteo.yml"]

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pillow
      - name: Récupérer la météo
        run: python scripts/meteo.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Météo $(date -u +%F)"
          git pull --rebase -q && git push
